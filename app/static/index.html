<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection Manager</title>
<style>
  :root { --bg:#fff; --fg:#1d2129; --muted:#6b7280; --line:#e3e6ea; --chip:#eef1f5; --selbg:#e6edff; --onaccent:#fff;
          --accent:#3b6cf6; --auto:#b45309; --autobg:#fdf3e3; --pass:#15803d; --warn:#b45309; --fail:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --fg:#e6e8eb; --muted:#9aa3ae; --line:#2a2f37; --chip:#232831; --selbg:#1f2c4d; --onaccent:#0b1020;
            --accent:#7a9bff; --auto:#f0b45a; --autobg:#33291a; --pass:#4ade80; --warn:#f0b45a; --fail:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:14px 20px 0; max-width:1100px; margin:0 auto; }
  main { padding:0 20px 40px; max-width:1100px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 10px; }
  nav { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--line); }
  nav button { background:none; border:0; padding:8px 14px; color:var(--muted); font:inherit; cursor:pointer;
               border-bottom:2px solid transparent; margin-bottom:-1px; }
  nav button.on { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; padding:12px 0; }
  .bar label { display:inline-flex; gap:5px; align-items:center; cursor:pointer; }
  input[type=search], select { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg);
                       color:var(--fg); font:inherit; }
  input[type=search] { min-width:220px; }
  .bar label { max-width:100%; }
  .bar select { min-width:0; max-width:100%; }
  button.act { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--chip);
               color:var(--fg); font:inherit; cursor:pointer; }
  button.act:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--onaccent); font-weight:600; }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  ul.rows { list-style:none; margin:0; padding:0; }
  ul.rows > li { padding:8px 0; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline; }
  .title { font-weight:500; }
  .chip { background:var(--chip); border-radius:10px; padding:1px 9px; font-size:13px; }
  .chip.auto { background:var(--autobg); color:var(--auto); }
  .badge { font-size:12px; border-radius:4px; padding:1px 6px; background:var(--autobg); color:var(--auto); margin-left:6px; }
  details { padding:8px 0; border-bottom:1px solid var(--line); }
  details summary { cursor:pointer; font-weight:500; }
  details ul { margin:8px 0 2px 18px; padding:0; }
  .err { color:var(--fail); padding:12px 0; white-space:pre-wrap; }
  .warn { color:var(--warn); padding:4px 0; }
  .check { padding:9px 0; border-bottom:1px solid var(--line); }
  .st { display:inline-block; min-width:44px; font-weight:700; font-size:12px; }
  .st.pass { color:var(--pass); } .st.warn { color:var(--warn); } .st.fail { color:var(--fail); }

  /* editor */
  .dual { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:stretch; }
  .dual section { min-width:0; display:flex; flex-direction:column; gap:6px; }
  .dual h3 { margin:0; font-size:14px; }
  .dual input[type=search] { min-width:0; width:100%; }
  ul.pick { list-style:none; margin:0; padding:0; height:min(60vh, 520px); overflow:auto;
            border:1px solid var(--line); border-radius:8px; }
  ul.pick li.row { display:flex; flex-wrap:wrap; gap:2px 8px; align-items:baseline; padding:6px 10px;
                   border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  ul.pick li.row:hover { background:var(--chip); }
  ul.pick li.row.sel { background:var(--selbg); outline:1px solid var(--accent); outline-offset:-1px; }
  ul.pick li.row:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  ul.pick li .mark { display:inline-block; width:12px; font-weight:700; }
  li.pend-add { box-shadow:inset 3px 0 0 var(--pass); } li.pend-add .mark { color:var(--pass); }
  li.pend-rem { box-shadow:inset 3px 0 0 var(--fail); } li.pend-rem .mark { color:var(--fail); }
  .mid { display:flex; flex-direction:column; justify-content:center; gap:10px; }
  button.mv { white-space:nowrap; }
  .pending { margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
             display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .review { flex-basis:100%; display:grid; gap:6px; }
  .review .st { min-width:56px; }
  .banner { margin:0 0 10px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); }
  .banner.ok { border-color:var(--pass); } .banner.bad { border-color:var(--fail); }
  @media (max-width: 760px) {
    .dual { grid-template-columns:1fr; }
    .mid { flex-direction:row; justify-content:center; }
  }
  .kindsw { margin-left:auto; display:flex; gap:4px; align-items:center; padding-bottom:4px; }
  .ok { color:var(--pass); padding:12px 0; }
  .selrow { display:inline-flex; gap:8px; align-items:baseline; cursor:pointer; }
  .editpanel { flex-basis:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:grid; gap:10px; }
  .cols { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:4px 14px; max-height:220px; overflow:auto; }
  .cols label { display:inline-flex; gap:6px; align-items:baseline; cursor:pointer; }
  .cols label.managed { cursor:not-allowed; color:var(--auto); }
  .row-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  footer { margin-top:28px; }
  .chip.lib { background:none; border:1px solid var(--line); color:var(--muted); }
  .newcol { display: inline-flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .newcol input { min-width: 12rem; }
</style>
</head>
<body>
<header>
  <h1>Collection Manager <span class="muted" id="server"></span></h1>
  <nav id="tabs"></nav>
</header>
<main>
  <div class="bar" id="filters"></div>
  <div id="msg"></div>
  <div id="view"></div>
  <footer id="foot" class="muted small"></footer>
</main>
<script>
"use strict";
// All Jellyfin data is rendered with textContent / text nodes, never innerHTML.
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const label = (s) => s.year ? `${s.name} (${s.year})` : s.name;
// Library names only help when there is more than one library to tell apart.
function libChips(s) {
  const libs = state.snap.libraries.filter(l => l.kinds.includes(s.kind || state.kind));
  if (libs.length < 2) return [];
  const names = new Map(state.snap.libraries.map(l => [l.id, l.name]));
  return (s.library_ids || []).map(id => names.get(id)).filter(Boolean).map(n => h("span", { class: "chip lib", title: "Library" }, n));
}
const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }) || (a.year || 0) - (b.year || 0);

const state = {
  snap: null, tab: "editor", libs: new Set(), query: "", ignoreManaged: true, checks: null,
  editCol: null, pendAdd: new Set(), pendRem: new Set(), selL: new Set(), selR: new Set(),
  lastL: null, lastR: null, qL: "", qR: "", confirming: false, busy: false, result: null,
  creating: false, newName: "", kind: "show",
  delCol: null, delText: "", ucSel: new Set(), ucTarget: "", ucConfirm: false, itemEdit: null, itemSet: new Set(), itemConfirm: false,
};
let ed = {};   // handles to the editor's DOM nodes, rebuilt whenever the editor tab renders
const KINDS = { show: { many: "shows", Many: "Shows" }, movie: { many: "movies", Many: "Movies" } };
const kw = () => KINDS[state.kind];
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const catalog = () => state.kind === "movie" ? state.snap.movies : state.snap.shows;
const kindLibs = () => state.snap.libraries.filter(l => l.kinds.includes(state.kind));
const hasMovies = () => !!state.snap && state.snap.libraries.some(l => l.kinds.includes("movie"));
function setKind(k) {
  if (state.kind === k) return;
  state.kind = k; state.selL.clear(); state.selR.clear(); state.lastL = state.lastR = null;
  state.confirming = false; state.creating = false;
  state.ucSel.clear(); state.ucConfirm = false; state.itemEdit = null; state.itemConfirm = false; render();
}
const TABS = [["editor", "Editor"], ["shows", "Shows"], ["uncollected", "Uncollected"],
              ["collections", "Collections"], ["check", "Self-check"]];

async function api(path) {
  const resp = await fetch(path);
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.error || `HTTP ${resp.status}`);
  return body;
}
async function postJson(path, payload) {
  const resp = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Requested-With": "jf-collections" },
    body: JSON.stringify(payload),
  });
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.error || `HTTP ${resp.status}`);
  return body;
}
function setMsg(text, cls) {
  const m = document.getElementById("msg");
  m.replaceChildren(text ? h("div", { class: cls || "err" }, text) : "");
}

async function load(refresh, keepMsg) {
  if (!keepMsg) setMsg("");
  try {
    state.snap = await api("/api/snapshot" + (refresh ? "?refresh=true" : ""));
    if (!state.libs.size) state.snap.libraries.filter(l => l.kinds.length).forEach(l => state.libs.add(l.id));
    ensureEditCol();
    prunePending();
    const s = state.snap.server;
    document.getElementById("server").textContent = s && s.name ? `· ${s.name} ${s.version || ""}` : "";
  } catch (e) { state.snap = null; setMsg(`Could not load from Jellyfin: ${e.message}`); }
  render();
}

function colMap() { return new Map(state.snap.collections.map(c => [c.id, c])); }
function currentCol() { return state.snap && state.snap.collections.find(c => c.id === state.editCol) || null; }
function clearEdits() { state.pendAdd.clear(); state.pendRem.clear(); state.selL.clear(); state.selR.clear();
                        state.lastL = state.lastR = null; state.confirming = false; }
function ensureEditCol() {
  const cols = state.snap.collections;
  if (!cols.some(c => c.id === state.editCol)) {
    state.editCol = (cols.find(c => !c.managed) || cols[0] || {}).id || null;
    clearEdits();
  }
}
// After a reload, forget staged changes Jellyfin already reflects (e.g. after a partly applied change).
function prunePending() {
  const col = currentCol();
  if (!col) { clearEdits(); return; }
  const base = new Set(col.members.map(m => m.id));
  for (const id of [...state.pendAdd]) if (base.has(id)) state.pendAdd.delete(id);
  for (const id of [...state.pendRem]) if (!base.has(id)) state.pendRem.delete(id);
}
function lockReason() {
  if (state.snap.read_only) return "The app is in read-only mode, so editing is disabled.";
  const col = currentCol();
  if (col && col.managed) return `"${col.name}" is managed by the Auto Collections plugin, which would undo changes made here. It is shown read-only.`;
  return "";
}

function visibleShows(ids) {
  const q = state.query.trim().toLowerCase();
  const idSet = ids ? new Set(ids) : null;
  return catalog().filter(s =>
    (!idSet || idSet.has(s.id)) &&
    s.library_ids.some(id => state.libs.has(id)) &&
    (!q || s.name.toLowerCase().includes(q)));
}

function renderTabs() {
  const sw = state.snap && hasMovies()
    ? [h("span", { class: "kindsw", role: "group", "aria-label": "Titles to work on" },
        ...["show", "movie"].map(k => h("button", { class: "act" + (state.kind === k ? " primary" : ""),
          "aria-pressed": state.kind === k ? "true" : "false", onclick: () => setKind(k) }, KINDS[k].Many)))]
    : [];
  document.getElementById("tabs").replaceChildren(...TABS.map(([id, name]) =>
    h("button", { class: state.tab === id ? "on" : "", onclick: () => { state.tab = id; render(); } },
      id === "shows" && state.snap ? kw().Many : name)), ...sw);
}

function renderFilters() {
  const bar = document.getElementById("filters");
  if (!state.snap || ["collections", "check", "editor"].includes(state.tab)) { bar.replaceChildren(); return; }
  const libs = kindLibs().map(l =>
    h("label", {}, h("input", { type: "checkbox", checked: state.libs.has(l.id), onchange: (ev) => {
      ev.target.checked ? state.libs.add(l.id) : state.libs.delete(l.id); renderView(); } }), l.name));
  const search = h("input", { type: "search", placeholder: "Filter by title", value: state.query,
    oninput: (ev) => { state.query = ev.target.value; renderView(); } });
  const extra = [];
  if (state.tab === "uncollected") {
    extra.push(h("label", {}, h("input", { type: "checkbox", checked: state.ignoreManaged, onchange: (ev) => {
      state.ignoreManaged = ev.target.checked; renderView(); } }), "Ignore plugin-managed collections"));
  }
  bar.replaceChildren(...libs, search, ...extra,
    h("button", { class: "act", onclick: () => load(true) }, "Refresh"));
  search.focus && state.query && search.setSelectionRange(state.query.length, state.query.length);
}

function renderShows() {
  const cols = colMap(), rows = visibleShows();
  const ro = !!state.snap.read_only;
  return [h("div", { class: "muted" }, `${rows.length} ${kw().many}`),
    h("ul", { class: "rows" }, rows.map(s => h("li", {},
      h("span", { class: "title" }, label(s)), ...libChips(s),
      s.collection_ids.length ? s.collection_ids.map(id => cols.get(id)).filter(Boolean).map(c =>
        h("span", { class: "chip" + (c.managed ? " auto" : "") }, c.name))
        : h("span", { class: "muted" }, "no collection"),
      ro ? null : h("button", { class: "act small", "aria-label": `Edit collections for ${s.name}`,
        onclick: () => openItemEdit(s) }, state.itemEdit === s.id ? "Close" : "Edit collections"),
      state.itemEdit === s.id ? itemPanel(s) : null)))];
}

function openItemEdit(s) {
  if (state.itemEdit === s.id) { state.itemEdit = null; }
  else { state.itemEdit = s.id; state.itemSet = new Set(s.collection_ids); }
  state.itemConfirm = false; renderView();
}
function itemDiff(s) {
  const orig = new Set(s.collection_ids), now = state.itemSet;
  return { add: [...now].filter(id => !orig.has(id)), remove: [...orig].filter(id => !now.has(id)) };
}
function itemPanel(s) {
  const cols = state.snap.collections, byId = colMap(), d = itemDiff(s);
  const names = (ids) => ids.map(id => byId.get(id)).filter(Boolean).map(c => c.name).join(", ");
  const boxes = cols.map(c => h("label", { class: c.managed ? "managed" : "",
      title: c.managed ? "Managed by the Auto Collections plugin; change it in the plugin's rules" : "" },
    h("input", { type: "checkbox", checked: state.itemSet.has(c.id), disabled: c.managed || state.busy,
      onchange: (ev) => { ev.target.checked ? state.itemSet.add(c.id) : state.itemSet.delete(c.id);
                          state.itemConfirm = false; renderView(); } }),
    c.name + (c.managed ? " (managed)" : "")));
  const body = state.itemConfirm
    ? [h("div", { class: "review" }, h("strong", {}, `Apply these changes to ${label(s)}?`),
        d.add.length ? h("div", {}, h("span", { class: "st pass" }, "ADD TO"), names(d.add)) : null,
        d.remove.length ? h("div", {}, h("span", { class: "st fail" }, "REMOVE FROM"), names(d.remove)) : null,
        h("div", { class: "muted small" }, "Removing it from a collection never deletes it from your library.")),
      h("div", { class: "row-actions" },
        h("button", { class: "act primary", disabled: state.busy, onclick: () => doItemApply(s) }, state.busy ? "Applying…" : "Confirm"),
        h("button", { class: "act", disabled: state.busy, onclick: () => { state.itemConfirm = false; renderView(); } }, "Cancel"))]
    : [h("div", { class: "row-actions" },
        h("button", { class: "act primary", disabled: !(d.add.length || d.remove.length),
          onclick: () => { state.itemConfirm = true; renderView(); } }, "Apply…"),
        h("button", { class: "act", disabled: !(d.add.length || d.remove.length),
          onclick: () => { state.itemSet = new Set(s.collection_ids); renderView(); } }, "Revert"),
        h("span", { class: "muted small" }, d.add.length || d.remove.length
          ? `Pending: +${d.add.length} −${d.remove.length}` : "No pending changes"))];
  return h("div", { class: "editpanel" }, h("div", { class: "cols" }, boxes), ...body);
}
async function doItemApply(s) {
  const d = itemDiff(s);
  state.busy = true; setMsg(""); renderView();
  let failed = false;
  try {
    const r = await postJson(`/api/items/${encodeURIComponent(s.id)}/collections`, { add_to: d.add, remove_from: d.remove });
    const bits = [r.added_to.length ? `added to ${r.added_to.join(", ")}` : null,
                  r.removed_from.length ? `removed from ${r.removed_from.join(", ")}` : null].filter(Boolean);
    if (!r.applied) setMsg(`Nothing to change for ${label(s)}; Jellyfin already had it that way.`, "muted");
    else if (r.verified) setMsg(`${label(s)}: ${bits.join("; ")}. Checked against Jellyfin: every change is there.`, "ok");
    else setMsg(`${label(s)}: applied, but Jellyfin does not show ${r.mismatches.map(m => m.collection).join(", ")}. Refresh and check.`);
    state.itemEdit = null; state.itemConfirm = false;
  } catch (e) { failed = true; setMsg(`Not applied: ${e.message}`); }
  state.busy = false;
  await load(true, true);
}

function renderUncollected() {
  const ids = state.ignoreManaged ? state.snap.uncollected_ids_ignoring_managed : state.snap.uncollected_ids;
  const rows = visibleShows(ids);
  const visible = new Set(rows.map(r => r.id));
  for (const id of [...state.ucSel]) if (!visible.has(id)) state.ucSel.delete(id);   // only what you can see is acted on
  const cols = state.snap.collections.filter(c => !c.managed);
  if (!cols.some(c => c.id === state.ucTarget)) state.ucTarget = "";
  const ro = !!state.snap.read_only, n = state.ucSel.size;
  const target = cols.find(c => c.id === state.ucTarget);
  const chosen = rows.filter(r => state.ucSel.has(r.id));

  const tools = ro ? [] : [h("div", { class: "bar" },
    h("button", { class: "act", onclick: () => { rows.forEach(r => state.ucSel.add(r.id)); state.ucConfirm = false; renderView(); } }, "Select all"),
    h("button", { class: "act", disabled: !n, onclick: () => { state.ucSel.clear(); state.ucConfirm = false; renderView(); } }, "Clear"),
    h("label", {}, "Add selected to",
      h("select", { "aria-label": "Target collection", onchange: (ev) => { state.ucTarget = ev.target.value; state.ucConfirm = false; renderView(); } },
        h("option", { value: "" }, "Choose a collection…"),
        cols.map(c => h("option", { value: c.id, selected: c.id === state.ucTarget }, c.name)))),
    h("button", { class: "act primary", disabled: !n || !target || state.busy,
      onclick: () => { state.ucConfirm = true; renderView(); } }, "Add to collection…"),
    h("span", { class: "muted small" }, `${n} selected`))];
  const confirm = state.ucConfirm && target && n ? [h("div", { class: "pending" },
    h("div", { class: "review" }, h("strong", {}, `Add these ${n} ${n === 1 ? "title" : "titles"} to "${target.name}"?`),
      h("div", {}, h("span", { class: "st pass" }, "ADD"), chosen.map(label).join(", ")),
      h("div", { class: "muted small" }, "Nothing is removed from any other collection.")),
    h("button", { class: "act primary", disabled: state.busy, onclick: () => doBulkAdd(target, chosen) }, state.busy ? "Adding…" : "Confirm"),
    h("button", { class: "act", disabled: state.busy, onclick: () => { state.ucConfirm = false; renderView(); } }, "Cancel"))] : [];

  return [h("div", { class: "muted" }, `${rows.length} ${kw().many} in no collection` +
      (state.ignoreManaged ? ` (${kw().many} only in plugin-managed collections are included)` : "")),
    ...tools, ...confirm,
    h("ul", { class: "rows" }, rows.map(s => h("li", {},
      ro ? [h("span", { class: "title" }, label(s)), ...libChips(s)]
         : h("label", { class: "selrow" },
             h("input", { type: "checkbox", checked: state.ucSel.has(s.id), "aria-label": `Select ${s.name}`,
               onchange: (ev) => { ev.target.checked ? state.ucSel.add(s.id) : state.ucSel.delete(s.id);
                                   state.ucConfirm = false; renderView(); } }),
             h("span", { class: "title" }, label(s)), ...libChips(s)))))];
}
async function doBulkAdd(target, chosen) {
  state.busy = true; setMsg(""); renderView();
  try {
    const r = await postJson(`/api/collections/${encodeURIComponent(target.id)}/apply`, { add: chosen.map(c => c.id), remove: [] });
    if (!r.applied) setMsg(`Nothing to change; those titles were already in "${r.collection}".`, "muted");
    else if (r.verified) setMsg(`Added ${r.added.length} to "${r.collection}". Checked against Jellyfin: every change is there.`, "ok");
    else setMsg(`Added to "${r.collection}", but Jellyfin does not show: ${r.mismatches.map(m => m.name).join(", ")}.`);
    state.ucSel.clear(); state.ucConfirm = false;
  } catch (e) { setMsg(`Not applied: ${e.message}`); }
  state.busy = false;
  await load(true, true);
}

function renderCollections() {
  const snap = state.snap;
  const note = !snap.read_only && !snap.delete_enabled
    ? [h("div", { class: "muted small" }, "Deleting empty collections is off: set user_id in the config so the app can reliably see collection members.")] : [];
  return [h("div", { class: "muted bar" }, `${snap.collections.length} collections`), ...note,
    ...snap.collections.map(c => {
      const empty = !c.members.length && !c.other_count;
      return h("details", { open: state.delCol === c.id },
        h("summary", {}, c.name, h("span", { class: "muted" }, ` · ${empty ? "empty" : countKinds(c)}`),
          c.other_count ? h("span", { class: "muted" }, ` · ${c.other_count} other items`) : null,
          c.managed ? h("span", { class: "badge" }, "managed by Auto Collections") : null),
        h("ul", {}, c.members.map(m => h("li", {}, label(m),
          m.kind === "movie" ? h("span", { class: "chip" }, "movie") : null))),
        snap.delete_enabled && empty && !c.managed ? deletePanel(c) : null);
    })];
}
function deletePanel(c) {
  if (state.delCol !== c.id)
    return h("div", { class: "row-actions" }, h("button", { class: "act", onclick: (ev) => {
      ev.preventDefault(); state.delCol = c.id; state.delText = ""; renderView(); } }, "Delete this empty collection…"));
  const matches = state.delText === c.name;
  return h("div", { class: "editpanel" },
    h("div", { class: "review" }, h("strong", {}, `Delete the empty collection "${c.name}"?`),
      h("div", { class: "muted small" }, "This removes the collection from Jellyfin, and any ErsatzTV channel built on it will lose its source. " +
        "It holds no shows or movies, and none are deleted. Type the collection's exact name to confirm.")),
    h("div", { class: "row-actions" },
      h("input", { type: "text", "aria-label": "Type the collection name to confirm", placeholder: c.name, value: state.delText,
        oninput: (ev) => { state.delText = ev.target.value; const b = document.getElementById("delGo"); if (b) b.disabled = state.busy || ev.target.value !== c.name; } }),
      h("button", { id: "delGo", class: "act primary", disabled: !matches || state.busy, onclick: () => doDelete(c) }, state.busy ? "Deleting…" : "Delete"),
      h("button", { class: "act", disabled: state.busy, onclick: () => { state.delCol = null; state.delText = ""; renderView(); } }, "Cancel")));
}
async function doDelete(c) {
  state.busy = true; setMsg(""); renderView();
  try {
    const r = await postJson(`/api/collections/${encodeURIComponent(c.id)}/delete`, { confirm_name: state.delText });
    if (r.verified) setMsg(`Deleted the empty collection "${r.name}". Checked against Jellyfin: it is gone.`, "ok");
    else setMsg(`Asked Jellyfin to delete "${r.name}", but it still lists it. Refresh and check.`);
    state.delCol = null; state.delText = "";
  } catch (e) { setMsg(`Not deleted: ${e.message}`); }
  state.busy = false;
  await load(true, true);
}
function countKinds(c) {
  const n = (k) => c.members.filter(m => m.kind === k).length;
  return [plural(n("show"), "show", "shows"), n("movie") ? plural(n("movie"), "movie", "movies") : null].filter(Boolean).join(", ");
}

function renderCheck() {
  const run = h("button", { class: "act", onclick: async (ev) => {
    ev.target.disabled = true; ev.target.textContent = "Running…"; setMsg("");
    try { state.checks = (await api("/api/selfcheck")).checks; } catch (e) { setMsg(e.message); }
    render();
  } }, state.checks ? "Run again" : "Run self-check");
  return [h("p", { class: "muted" }, "Tests the Jellyfin calls this app depends on and cross-checks the collection data. Read-only."),
    run,
    ...(state.checks || []).map(c => h("div", { class: "check" },
      h("span", { class: "st " + c.status }, c.status.toUpperCase()), h("strong", {}, c.name), h("div", { class: "muted" }, c.detail)))];
}

/* ---------------- editor ---------------- */

// id -> show-like record, for every show in a show library plus any collection member outside them
function info() {
  const m = new Map();
  for (const c of state.snap.collections)
    for (const x of c.members)
      if (!m.has(x.id)) m.set(x.id, { id: x.id, name: x.name, year: x.year, kind: x.kind, library_ids: [], collection_ids: [] });
  for (const s of [...state.snap.shows, ...state.snap.movies]) m.set(s.id, s);
  return m;
}

// What the two lists show once staged changes are applied on screen.
function lists() {
  const col = currentCol(), inf = info();
  const mine = (id) => { const t = inf.get(id); return t && t.kind === state.kind; };
  const base = new Set(col.members.filter(m => m.kind === state.kind).map(m => m.id));
  const right = new Set([...base].filter(id => !state.pendRem.has(id)));
  state.pendAdd.forEach(id => { if (mine(id)) right.add(id); });
  const ql = state.qL.trim().toLowerCase(), qr = state.qR.trim().toLowerCase();
  const leftIds = new Set();
  for (const s of catalog())
    if (!right.has(s.id) && s.library_ids.some(l => state.libs.has(l))) leftIds.add(s.id);
  state.pendRem.forEach(id => { if (mine(id) && !right.has(id)) leftIds.add(id); });   // always allow undoing a removal
  const pick = (ids, q) => [...ids].map(id => inf.get(id)).filter(Boolean)
    .filter(s => !q || s.name.toLowerCase().includes(q)).sort(byName);
  return { left: pick(leftIds, ql), right: pick(right, qr) };
}

function fill(ul, items, side) {
  const sel = side === "L" ? state.selL : state.selR;
  const cols = colMap();
  ul.replaceChildren(...items.map(s => {
    const pend = side === "R" ? state.pendAdd.has(s.id) : state.pendRem.has(s.id);
    const others = (s.collection_ids || []).map(id => cols.get(id)).filter(c => c && c.id !== state.editCol);
    return h("li", { "data-id": s.id, role: "option", tabindex: "0",
        "aria-selected": sel.has(s.id) ? "true" : "false",
        class: "row" + (sel.has(s.id) ? " sel" : "") + (pend ? (side === "R" ? " pend-add" : " pend-rem") : "") },
      h("span", { class: "mark" }, pend ? (side === "R" ? "+" : "−") : ""),
      h("span", { class: "title" }, label(s)), ...libChips(s),
      others.slice(0, 3).map(c => h("span", { class: "chip" + (c.managed ? " auto" : "") }, c.name)),
      others.length > 3 ? h("span", { class: "muted small" }, `+${others.length - 3}`) : null);
  }));
}

function rowClick(side, ev) {
  const li = ev.target.closest("li[data-id]");
  if (!li) return;
  const id = li.dataset.id;
  const sel = side === "L" ? state.selL : state.selR, order = side === "L" ? ed.orderL : ed.orderR;
  const lastKey = side === "L" ? "lastL" : "lastR";
  if (ev.shiftKey && state[lastKey] && order.includes(state[lastKey])) {
    const a = order.indexOf(state[lastKey]), b = order.indexOf(id);
    order.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => sel.add(x));
  } else {
    sel.has(id) ? sel.delete(id) : sel.add(id);
  }
  state[lastKey] = id;
  syncSelection();   // update rows in place: rebuilding them here would break double-click
}
function syncSelection() {
  if (!ed.ulL) return;
  for (const [ul, sel] of [[ed.ulL, state.selL], [ed.ulR, state.selR]])
    for (const li of ul.children) {
      const on = sel.has(li.dataset.id);
      li.classList.toggle("sel", on);
      li.setAttribute("aria-selected", on ? "true" : "false");
    }
  const visL = new Set(ed.orderL), visR = new Set(ed.orderR), lock = lockReason();
  ed.btnAdd.disabled = !!lock || state.busy || ![...state.selL].some(id => visL.has(id));
  ed.btnRem.disabled = !!lock || state.busy || ![...state.selR].some(id => visR.has(id));
}
function rowDbl(side, ev) {
  const li = ev.target.closest("li[data-id]");
  if (li && !lockReason() && !state.busy) moveIds(side, [li.dataset.id]);
}
function rowKey(side, ev) {
  const li = ev.target.closest("li[data-id]");
  if (!li) return;
  if (ev.key === " ") { ev.preventDefault(); rowClick(side, ev); }
  else if (ev.key === "Enter") { ev.preventDefault(); rowDbl(side, ev); }
}

// from "L": add to the collection. from "R": remove from it. Staging only; nothing is sent to Jellyfin.
function moveIds(from, ids) {
  for (const id of ids) {
    if (from === "L") { state.pendRem.has(id) ? state.pendRem.delete(id) : state.pendAdd.add(id); state.selL.delete(id); }
    else { state.pendAdd.has(id) ? state.pendAdd.delete(id) : state.pendRem.add(id); state.selR.delete(id); }
  }
  state.result = null; state.confirming = false;
  setMsg("");
  updateEditor();
}
function moveSelected(from) {
  if (lockReason() || state.busy) return;
  const vis = new Set(from === "L" ? ed.orderL : ed.orderR);
  moveIds(from, [...(from === "L" ? state.selL : state.selR)].filter(id => vis.has(id)));
}

function onPickCollection(ev) {
  if (state.pendAdd.size || state.pendRem.size) {
    ev.target.value = state.editCol;
    setMsg("Apply or revert the pending changes before switching collections.", "warn");
    return;
  }
  state.editCol = ev.target.value;
  clearEdits(); state.result = null; setMsg("");
  updateEditor();
}

async function doApply() {
  const col = currentCol();
  state.busy = true; state.confirming = false; setMsg("");
  updateEditor();
  let failed = false;
  try {
    const resp = await fetch(`/api/collections/${encodeURIComponent(col.id)}/apply`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Requested-With": "jf-collections" },
      body: JSON.stringify({ add: [...state.pendAdd], remove: [...state.pendRem] }),
    });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(body.error || `HTTP ${resp.status}`);
    state.result = body;
    clearEdits();
  } catch (e) { failed = true; setMsg(`Not applied: ${e.message}`); }
  state.busy = false;
  await load(true, failed);
}

async function doCreate() {
  const name = state.newName.trim();
  if (!name || state.busy) return;
  state.busy = true; setMsg(""); updateEditor();
  let failed = false;
  try {
    const resp = await fetch("/api/collections", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Requested-With": "jf-collections" },
      body: JSON.stringify({ name }),
    });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(body.error || `HTTP ${resp.status}`);
    state.result = { created: true, name: body.name, verified: body.verified };
    if (body.id) state.editCol = body.id;
    clearEdits();
    state.creating = false; state.newName = "";
  } catch (e) { failed = true; setMsg(`Not created: ${e.message}`); }
  state.busy = false;
  await load(true, failed);
}

function createForm() {
  const n = state.pendAdd.size + state.pendRem.size;
  if (!state.creating)
    return h("button", { class: "act", disabled: !!state.snap.read_only || state.busy || n > 0,
      title: n ? "Apply or revert the pending changes first" : "", onclick: () => {
        state.creating = true; render(); const i = document.getElementById("newName"); if (i) i.focus(); } },
      "New collection…");
  return h("span", { class: "newcol" },
    h("input", { id: "newName", type: "text", maxlength: 100, placeholder: "New collection name", "aria-label": "New collection name",
      value: state.newName, oninput: (ev) => { state.newName = ev.target.value; },
      onkeydown: (ev) => { if (ev.key === "Enter") doCreate(); else if (ev.key === "Escape") { state.creating = false; render(); } } }),
    h("button", { class: "act primary", disabled: state.busy, onclick: doCreate }, state.busy ? "Creating…" : "Create"),
    h("button", { class: "act", disabled: state.busy, onclick: () => { state.creating = false; state.newName = ""; render(); } }, "Cancel"));
}

function resultBanner() {
  const r = state.result;
  if (!r) return "";
  if (r.created) return r.verified === false
    ? h("div", { class: "banner bad" }, `Jellyfin accepted "${r.name}" but it does not show up in the collection list yet. Press Refresh.`)
    : h("div", { class: "banner ok" }, `Created the empty collection "${r.name}". Add shows to it below.`);
  const parts = [`${r.added.length} added, ${r.removed.length} removed in "${r.collection}".`];
  const skipped = r.skipped_add.length + r.skipped_remove.length;
  if (skipped) parts.push(`${skipped} change(s) skipped because Jellyfin already had them in that state.`);
  if (!r.applied) return h("div", { class: "banner" }, "Nothing to change. " + parts.slice(1).join(" "));
  if (r.verified) return h("div", { class: "banner ok" }, `Applied: ${parts.join(" ")} Checked against Jellyfin: every change is there.`);
  return h("div", { class: "banner bad" }, `Applied, but Jellyfin does not show these changes: ` +
    r.mismatches.map(m => `${m.name} (expected ${m.expected === "in" ? "in" : "out of"} the collection)`).join(", ") +
    `. Another process may have changed the collection, or Jellyfin handled the request differently.`);
}

function pendingBar() {
  const inf = info(), col = currentCol();
  const n = state.pendAdd.size + state.pendRem.size;
  const lock = !!lockReason();
  if (state.confirming) {
    const names = (set) => [...set].map(id => inf.get(id)).filter(Boolean).sort(byName)
      .map(t => label(t) + (t.kind === "movie" ? " [movie]" : "")).join(", ");
    return [h("div", { class: "review" },
      h("strong", {}, `Apply these changes to "${col.name}"?`),
      state.pendAdd.size ? h("div", {}, h("span", { class: "st pass" }, "ADD"), names(state.pendAdd)) : null,
      state.pendRem.size ? h("div", {}, h("span", { class: "st fail" }, "REMOVE"), names(state.pendRem)) : null,
      h("div", { class: "muted small" }, "Removing a show here only takes it out of this collection. The show itself stays in your library.")),
      h("button", { class: "act primary", onclick: doApply }, "Confirm"),
      h("button", { class: "act", onclick: () => { state.confirming = false; updateEditor(); } }, "Cancel")];
  }
  return [h("span", { class: n ? "" : "muted" },
      n ? `Pending: +${state.pendAdd.size} −${state.pendRem.size}` : "No pending changes"),
    h("button", { class: "act primary", disabled: !n || lock || state.busy,
      onclick: () => { state.confirming = true; updateEditor(); } }, state.busy ? "Applying…" : "Apply…"),
    h("button", { class: "act", disabled: !n || state.busy,
      onclick: () => { clearEdits(); state.result = null; updateEditor(); } }, "Revert")];
}

function updateEditor() {
  if (state.tab !== "editor" || !ed.ulL || !state.snap) return;
  const col = currentCol(), lock = lockReason();
  const { left, right } = lists();
  ed.orderL = left.map(s => s.id); ed.orderR = right.map(s => s.id);
  fill(ed.ulL, left, "L"); fill(ed.ulR, right, "R");
  ed.hL.textContent = `Not in collection (${left.length})`;
  const otherKind = col.members.filter(m => m.kind !== state.kind).length;
  ed.hR.textContent = `In "${col.name}" (${right.length})`;
  syncSelection();
  ed.note.replaceChildren(lock ? h("div", { class: "warn" }, lock) : "",
    otherKind ? h("div", { class: "muted small" }, `This collection also holds ${state.kind === "movie" ? plural(otherKind, "show", "shows") : plural(otherKind, "movie", "movies")}; ` +
      `switch to ${state.kind === "movie" ? "Shows" : "Movies"} above to see or change them.`) : "");
  const banner = resultBanner();
  ed.result.replaceChildren(banner || "");
  ed.pending.replaceChildren(...pendingBar());
  if (ed.newBox && !(state.creating && document.activeElement && document.activeElement.id === "newName"))
    ed.newBox.replaceChildren(createForm());
  if (state.confirming) ed.pending.scrollIntoView({ block: "nearest" });
}

function renderEditor() {
  ed = {};
  const cols = state.snap.collections;
  if (!cols.length)
    return [h("div", { class: "bar" }, createForm()), h("p", { class: "muted" }, "There are no collections yet. Create the first one above.")];

  const select = h("select", { "aria-label": "Collection", onchange: onPickCollection },
    cols.map(c => h("option", { value: c.id }, c.name + (c.managed ? " (managed, read-only)" : ""))));
  select.value = state.editCol;
  const libBoxes = kindLibs().map(l =>
    h("label", {}, h("input", { type: "checkbox", checked: state.libs.has(l.id), onchange: (ev) => {
      ev.target.checked ? state.libs.add(l.id) : state.libs.delete(l.id); updateEditor(); } }), l.name));

  const side = (key, heading, ul) => h("section", {}, heading,
    h("input", { type: "search", placeholder: "Filter by title", "aria-label": "Filter " + key, value: state[key],
      oninput: (ev) => { state[key] = ev.target.value; updateEditor(); } }), ul);
  const mkList = (s, name) => {
    const ul = h("ul", { class: "pick", role: "listbox", "aria-multiselectable": "true", "aria-label": name });
    ul.addEventListener("click", (ev) => rowClick(s, ev));
    ul.addEventListener("dblclick", (ev) => rowDbl(s, ev));
    ul.addEventListener("keydown", (ev) => rowKey(s, ev));
    return ul;
  };
  ed.hL = h("h3"); ed.hR = h("h3");
  ed.ulL = mkList("L", `${kw().Many} not in the collection`); ed.ulR = mkList("R", `${kw().Many} in the collection`);
  ed.btnAdd = h("button", { class: "act mv", onclick: () => moveSelected("L") }, "Add →");
  ed.btnRem = h("button", { class: "act mv", onclick: () => moveSelected("R") }, "← Remove");
  ed.newBox = h("span", {}, createForm());
  ed.note = h("div"); ed.result = h("div"); ed.pending = h("div", { class: "pending" });

  return [
    h("div", { class: "bar" }, h("label", {}, "Collection", select), ...libBoxes,
      h("button", { class: "act", onclick: () => load(true) }, "Refresh"), ed.newBox),
    ed.note, ed.result,
    h("div", { class: "dual" },
      side("qL", ed.hL, ed.ulL),
      h("div", { class: "mid" }, ed.btnAdd, ed.btnRem),
      side("qR", ed.hR, ed.ulR)),
    ed.pending,
    h("p", { class: "muted small" }, `Click a ${state.kind} to select it (click again to deselect), Shift-click for a range, double-click or Enter to move one. ` +
      "Moves are only staged; nothing changes in Jellyfin until you apply. Chips show each title's other collections."),
  ];
}

function renderView() {
  const view = document.getElementById("view");
  if (state.tab === "check") { view.replaceChildren(...renderCheck()); return; }
  if (!state.snap) { view.replaceChildren(); return; }
  const fn = { editor: renderEditor, shows: renderShows, uncollected: renderUncollected,
               collections: renderCollections }[state.tab];
  const warnings = (state.snap.warnings || []).map(w => h("div", { class: "warn" }, w));
  view.replaceChildren(...warnings, ...fn());
  if (state.tab === "editor") updateEditor();
}
function render() { renderTabs(); renderFilters(); renderView(); }

// Staged changes live only in this page, so warn before it is closed or reloaded with any pending.
function hasUnsaved() {
  if (!state.snap) return false;
  if (state.pendAdd.size || state.pendRem.size) return true;
  const it = state.itemEdit && [...state.snap.shows, ...state.snap.movies].find(x => x.id === state.itemEdit);
  if (it) { const d = itemDiff(it); if (d.add.length || d.remove.length) return true; }
  return false;
}
window.addEventListener("beforeunload", (ev) => {
  if (hasUnsaved()) { ev.preventDefault(); ev.returnValue = ""; }
});

fetch("/api/health").then(r => r.json()).then(b => {
  document.getElementById("foot").textContent = `Collection Manager ${b.version || ""}`.trim();
}).catch(() => {});

load(false);
</script>
</body>
</html>
